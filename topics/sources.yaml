mail:
  note: >-
    받은 뉴스레터. 폴더에 .eml 을 내려받고 study topics mail 로 읽는다.
    피드와 다루는 방식이 다른 이유는 이미 사람이 고르고 해석까지 얹은 글이기
    때문이다. 잘 정리되어 있을수록 그대로 믿기 쉬워서 더 조심한다
  gives: >-
    피드가 못 주는 두 가지가 여기 있다. 하나는 인과다. "엔화가 하루에 2.2%
    빠졌다"는 어댑터가 알지만 "미일 공동 개입 때문"은 여기서만 온다.
    다른 하나는 앞으로 있을 일이다. 실적 발표일·공모주 청약·지표 발표는
    어떤 어댑터로도 못 가져온다
  costs: >-
    숫자를 그대로 옮기면 틀린다. UPPITY 가 엔화 저점을 155엔대라고 썼는데
    ECOS 일별 매매기준율은 157.32 였다. 뽑은 항목은 전부 대조 대상이지
    사실이 아니다
  letters:
  - id: uppity
    layer: 통념
    from: moneyletter@uppity.co.kr
    name: UPPITY
    note: 일정 섹션이 있는 유일한 곳. 이 경로에서 가장 값진 부분이다
  - id: dailybyte
    layer: 통념
    from: byteteam365@mydailybyte.com
    name: DAILY_BYTE
    note: 핵심만 콕콕 세 줄이 사실상 편집자가 고른 그날의 주제다
  - id: newneek
    layer: 통념
    from: whatsup@newneek.co
    name: NEWNEEK
    note: 하루 한 건을 깊게 판다. 배경 설명이 두꺼워 쟁점 채우기에 쓸 만하다
  - id: coinbyte
    layer: 통념
    from: byteteam365@mydailybyte.com
    name: COIN_BYTE
    note: 가상자산 전용이라 6축에만 걸린다
  - id: deepsearch
    layer: 통념
    from: noreply@deepsearch.com
    name: DeepSearch 토픽 인사이트
    generated: true
    note: >-
      LLM 이 쓴 글이고 본문 말미에 정확성을 보장하지 않는다고 스스로 밝힌다.
      앞머리 요약의 사실은 쓰되 '인사이트'는 버린다. "지속될지 불확실하며
      신중한 접근이 필요합니다" 같은 문장은 검증 대상조차 되지 못한다
manual:
- name: 한경 컨센서스 / Npay 리서치
  layer: 견해
  why: RSS 가 없고 PDF 리포트다. 그리고 매도측 리서치는 후보 발굴용이 아니다. 목표주가와 결론이 먼저 오기 때문에 주제를 여기서 찾으면 그 결론을
    그대로 물려받는다. 질문이 정해진 뒤 splits 를 채울 때 쓴다
- name: JP모건·골드만삭스 등 해외 IB
  layer: 견해
  why: 원문 접근이 안 된다. 언론 인용으로만 들어온다. 위와 같은 이유로 견해층
- name: 로이터·블룸버그·CNBC·WSJ
  layer: 통념
  why: 유료이거나 약관 문제가 있다. 해외 시각이 필요할 때 AI 웹검색으로 보조하되, 검색 결과를 그대로 믿지 말고 1차 소스까지 따라간다
- name: 투자 커뮤니티
  layer: 통념
  why: 사이트마다 구조가 다르고 신호 대비 잡음이 크다. 다만 유튜브보다 먼저 움직이는 경우가 있어 눈으로 볼 가치는 있다
- name: 정부기관 (한국은행·기재부·통계청·금감원)
  layer: 1차
  why: 보도자료 페이지가 RSS 가 아니라 동적 HTML 이다. 그런데 여기 있는 숫자는 대부분 ECOS·KRX·DART 어댑터로 이미 들어온다. 보도자료
    본문이 꼭 필요할 때만 직접 본다
- name: 네이버 뉴스
  layer: 통념
  why: 스크래핑은 약관 문제가 있고 검색 API 는 언론사가 제한된다. 연합·한경 RSS 로 대체한다
