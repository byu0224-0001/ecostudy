id: S-001
date: 2026-08-12
axis: 1
judgment: 리스크
title: 엔캐리와 미국 장기금리
question: 엔캐리 청산 위험이 실제로 얼마나 큰가. 포지션 규모가 서사에 걸맞나.

topic: null          # 후보 풀 이전에 진행한 회차
origin: 뉴스·이슈

settled:
  - text: CFTC 엔 선물 레버리지펀드 롱·숏 합계 약 21만 계약
    source: CFTC Traders in Financial Futures, 2026-08 주간
  - text: 전체 미결제약정 419,393계약. 레버리지펀드 포지션은 그 절반 수준
    source: CFTC Traders in Financial Futures, 2026-08 주간
  - text: FIMA 레포 잔고 0
    source: 뉴욕 연준
  - text: SOFR-IORB 스프레드 안정 구간 유지
    source: 뉴욕 연준

split:
  - point: 21만 계약이라는 규모를 어떻게 볼 것인가
    positions:
      - 미결제약정의 절반에 불과하니 청산 충격은 제한적이다
      - 선물은 엔캐리 전체의 일부일 뿐이라 규모를 과소평가한 것이다
  - point: BOJ 정상화 속도를 무엇이 제약하는가
    positions:
      - 재정 부담이 커서 빠른 인상이 어렵다
      - 임금·물가가 이미 올라 정상화를 미룰 수 없다
  - point: FIMA 잔고 0 을 어떻게 읽을 것인가
    positions:
      - 평시에 쓸 유인이 없는 백스톱이라 정상이다
      - 언급 자체가 미국 장기금리 방어 의도를 드러낸다

claims_checked:
  - claim: 엔화 급변의 배경은 레버리지 펀드의 대규모 청산이다
    result: contradicts
    note: 서사가 시사하는 규모와 실제 포지션이 달랐다. 이 간극이 회차의 알맹이가 됐다

data:
  - source: cftc
    dataset: traders_in_financial_futures
    note: 어댑터 없음. 수작업으로 받았다
  - source: mof_japan
    dataset: JGB 입찰 결과
    note: 어댑터 없음

open:
  - question: 선물 밖의 엔캐리 익스포저는 어떻게 재나
    why: 은행 대출·크로스커런시 스왑 데이터에 접근할 방법을 찾지 못했다
  - question: BOJ 가 인상을 이어가면 일본 재정 부담은 어느 지점에서 제약이 되나
    why: 이자비용 민감도를 계산할 발행 잔액·만기 구조 데이터를 준비하지 못했다
  - question: 미국 장기금리와 엔캐리 중 어느 쪽이 원인이고 어느 쪽이 결과인가
    why: 시간이 부족했고, 인과를 가릴 방법 자체를 정하지 못했다

note: >-
  뉴스가 말한 것과 데이터가 보여준 것이 어긋난 자리에서 논의가 살았다.
  이 경험이 지금의 포착-대조-승격 절차로 굳었다.
