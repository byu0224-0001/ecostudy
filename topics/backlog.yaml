topics:

  # ── 1축 시장 국면 ──────────────────────────────────────────────

  - id: T-001
    axis: 1
    judgment: 국면
    title: 고점 대비 -22%, 조정인가 국면 전환인가
    question: >-
      코스피는 15개월간 3.3배 올랐다가 석 달 만에 22% 되돌렸다. 같은 기간
      국고 10년물은 한 번도 쉬지 않고 159bp 올랐다. 지금 빠지는 것은 과열
      해소인가, 금리가 만든 밸류에이션 재조정의 시작인가.
    why_now:
      - text: "코스피 8,476(26.05) → 6,579(26.08.12), -22.4%"
        source: KRX index_kospi
      - text: "국고 10년 2.709%(25.02) → 4.295%(26.08.12), 되돌림 없음"
        source: KRX bond_kts
      - text: "기준금리는 같은 기간 +25bp에 그침 (2.50 → 2.75)"
        source: ECOS 722Y001
    splits:
      - 실적 성장이 할인율 상승을 계속 흡수한다
      - 할인율이 임계를 넘어 밸류에이션이 먼저 조정된다
      - 둘 다 아니고 수급이 만든 변동이다
    data:
      ready: full
      series:
        - {source: krx, dataset: index_kospi, field: CLSPRC_IDX}
        - {source: krx, dataset: bond_kts, field: CLSPRC_YD}
        - {source: ecos, dataset: 722Y001, items: ["0101000"]}
        - {source: ecos, dataset: 901Y009, items: ["0"]}
    output: 무엇을 보면 이것이 조정이 아니라 전환이라고 판단할 것인가
    prep: 3
    origin: 지표 스캔
    status: candidate

  - id: T-002
    axis: 1
    judgment: 리스크
    title: 기준금리 +25bp, 30년물 +197bp
    question: >-
      정책금리는 한 번 올랐는데 초장기물은 2%p 가까이 올랐다. 커브가
      평행이동하지 않고 뒤쪽만 들렸다. 채권시장은 무엇을 가격에 넣고 있나.
    why_now:
      - text: "30년-3년 스프레드 29bp(25.08) → 89bp(26.08)"
        source: KRX bond_kts
      - text: "국고 3년이 기준금리보다 105bp 높다"
        source: KRX bond_kts + ECOS 722Y001
      - text: "국고채 발행액 월 22.6조 (26.05)"
        source: ECOS 100대 지표
    splits:
      - 재정 수급 부담이 장기물에 반영되고 있다
      - 인플레 기대가 구조적으로 올라섰다
      - 국내 요인이 아니라 글로벌 장기금리 동조다
    data:
      ready: partial
      series:
        - {source: krx, dataset: bond_kts, field: CLSPRC_YD}
        - {source: ecos, dataset: 722Y001, items: ["0101000"]}
      missing: 기획재정부 국고채 발행계획·잔액 (어댑터 없음)
    output: 내 포트폴리오에서 장기금리 4.7%를 견디지 못하는 자산은 무엇인가
    prep: 4
    origin: 지표 스캔
    links: [지난 회차 JGB·엔캐리]
    status: candidate

  - id: T-003
    axis: 1
    judgment: 비교
    title: 주식은 3.3배, 집값은 +1.4%
    question: >-
      한국에서 주식과 부동산은 대체로 같이 움직였다. 이번에는 주식만 갔다.
      무엇이 두 자산을 갈라놓았고, 그 요인은 지속되는 것인가.
    why_now:
      - text: "주택매매가격지수 101.4 (2025.03=100, 26.01)"
        source: ECOS 100대 지표
      - text: "같은 기간 코스피는 3배 이상"
        source: KRX index_kospi
      - text: "예금은행 대출금리 4.31% (26.06)"
        source: ECOS 100대 지표
    splits:
      - 대출 규제와 금리가 부동산만 눌렀다
      - 자금이 부동산에서 주식으로 이동한 것이다
      - 부동산이 뒤늦게 따라간다
    data:
      ready: partial
      series:
        - {source: krx, dataset: index_kospi, field: CLSPRC_IDX}
        - {source: ecos, dataset: 901Y062, note: 주택매매가격지수 — 통계코드 확인 필요}
      caveat: 부동산 지수는 26.01 이 최신이라 7개월 지연된다. 이 지연 자체를 다뤄야 한다
    output: 내 자산 배분에서 두 자산의 비중을 지금 바꿀 이유가 있는가
    prep: 4
    origin: 지표 스캔
    status: candidate

  - id: T-004
    axis: 1
    judgment: 국면
    title: 소비자심리 106.8 vs 기업심리 98.5
    question: >-
      가계는 낙관하고 기업은 비관한다. 과거에 이 괴리가 벌어졌을 때
      어느 쪽이 먼저 맞았나, 그리고 이번에는 왜 갈렸나.
    why_now:
      - text: "소비자심리지수 106.8, 전산업 기업심리지수 98.5, 경제심리 97.9 (26.07)"
        source: ECOS 100대 지표
      - text: "실업률 2.6%, 고용률 63.3% (26.07)"
        source: ECOS 100대 지표
      - text: "설비투자 전기비 +0.2%, 건설투자 -0.2% (26Q2)"
        source: ECOS 100대 지표
    splits:
      - 자산 가격이 가계 심리를 띄운 것이라 실물로 이어지지 않는다
      - 고용이 받쳐서 소비가 실제로 버틴다
      - 기업 비관이 선행지표라 소비도 곧 꺾인다
    data:
      ready: full
      series:
        - {source: ecos, dataset: 511Y002, note: 소비자동향조사 — 항목코드 확인 필요}
        - {source: ecos, dataset: 512Y013, note: 기업경기실사지수 — 항목코드 확인 필요}
    output: 나는 소비 관련 종목을 어느 쪽 신호로 판단하고 있었나
    prep: 3
    origin: 지표 스캔
    status: candidate

  - id: T-005
    axis: 1
    judgment: 리스크
    title: 단위노동비용이 생산성을 앞서고 있다
    question: >-
      임금이 생산성보다 빠르게 오르면 기업 마진이 눌리거나 물가로 넘어간다.
      지금 한국은 어느 쪽으로 가고 있나.
    why_now:
      - text: "단위노동비용지수 122.7 vs 노동생산성지수 114.0 (26Q1, 2020=100)"
        source: ECOS 100대 지표
      - text: "시간당명목임금지수 139.9 (26Q1)"
        source: ECOS 100대 지표
      - text: "CPI 전년비 5월 3.16% 정점 후 7월 2.79%"
        source: ECOS 901Y009
    splits:
      - 마진 압박으로 나타나 기업 이익이 꺾인다
      - 물가로 전가되어 금리 인하가 늦춰진다
      - 생산성이 따라잡아 해소된다
    data:
      ready: full
      series:
        - {source: ecos, dataset: 901Y009, items: ["0"]}
        - {source: ecos, dataset: 902Y002, note: 노동생산성·단위노동비용 — 통계코드 확인 필요}
    output: 내가 보유한 기업 중 인건비 비중이 높은 곳은 어디이고 마진은 어떻게 됐나
    prep: 4
    origin: 지표 스캔
    status: candidate

  # ── 2축 산업·섹터 비교 ─────────────────────────────────────────

  - id: T-006
    axis: 2
    judgment: 비교
    title: 금리 4% 시대에 무엇이 살아남았나
    question: >-
      10년물이 4.3%인 환경에서 업종별 성과가 어떻게 갈렸나. 그 차이는
      금리 민감도로 설명되는가, 아니면 다른 것이 작용했나.
    why_now:
      - text: "국고 10년 4.295%, 회사채 AA- 3년 4.496% (26.08.12)"
        source: KRX + ECOS
      - text: "코스피 고점 대비 -22% 국면에서 업종 간 편차가 커지는 구간"
        source: KRX index_kospi
    splits:
      - 금리 민감도가 성과를 대부분 설명한다
      - 실적 모멘텀이 금리를 압도한다
      - 수급·테마가 펀더멘털보다 컸다
    data:
      ready: full
      series:
        - {source: krx, dataset: index_kospi, note: 업종지수 IDX_NM 필터}
        - {source: krx, dataset: bond_kts, field: CLSPRC_YD}
    output: 내 포트폴리오의 업종 구성은 의도한 것인가 결과인가
    prep: 3
    origin: 지표 스캔
    status: candidate

  - id: T-007
    axis: 2
    judgment: 비교
    title: 재고와 출하가 갈라지는 업종
    question: >-
      제조업 전체로는 출하 112.9, 재고 106.3이다. 업종별로 나누면 이
      비율이 어떻게 다르고, 그것이 주가에 반영돼 있나.
    why_now:
      - text: "제조업출하지수 112.9, 재고지수 106.3, 가동률 105.3 (26.06)"
        source: ECOS 100대 지표
      - text: "수출금액지수 242.98 vs 수입 169.63 (26.06)"
        source: ECOS 100대 지표
    splits:
      - 재고 조정이 끝난 업종이 먼저 오른다
      - 이미 주가에 반영돼 늦었다
      - 재고 지표는 후행이라 투자 판단에 못 쓴다
    data:
      ready: partial
      series:
        - {source: ecos, dataset: 901Y033, note: 광공업 재고·출하 업종별 — 통계코드 확인 필요}
        - {source: krx, dataset: index_kospi, note: 업종지수}
      missing: >-
        ECOS 업종별 재고·출하 통계코드 미확정. 100대 지표는 제조업 총계만 준다.
        `cli.py ecos tables --search 재고` 로 먼저 확인해야 한다
    output: 재고·출하를 내 종목 판단에 실제로 쓸 것인가, 쓴다면 어떻게
    prep: 4
    origin: 지표 스캔
    status: candidate

  - id: T-008
    axis: 2
    judgment: 비교
    title: 수출은 사상 최고, 건설은 마이너스
    question: >-
      같은 나라 안에서 두 개의 경기가 돌고 있다. 이 격차는 포트폴리오에서
      어떻게 다뤄야 하나 — 회피인가, 역발상인가.
    why_now:
      - text: "수출금액지수 242.98 (26.06, 2020=100)"
        source: ECOS 100대 지표
      - text: "건설투자 전기비 -0.2% (26Q2), 건설수주 15.9조, 건축착공 8,002천㎡"
        source: ECOS 100대 지표
      - text: "경상수지 흑자 지속"
        source: ECOS 100대 지표
    splits:
      - 격차가 더 벌어진다 — 수출에 집중해야
      - 건설은 금리 인하 시 가장 크게 반등하는 역발상 후보
      - 내수 부진이 결국 수출 기업 실적도 끌어내린다
    data:
      ready: full
      series:
        - {source: ecos, dataset: 901Y011, note: 수출입금액지수 — 통계코드 확인 필요}
        - {source: krx, dataset: index_kospi, note: 건설·운수 업종지수}
    output: 나는 경기 격차를 회피로 다루나 역발상으로 다루나, 그 기준은
    prep: 3
    origin: 지표 스캔
    status: candidate

  # ── 3축 기업 분석 ──────────────────────────────────────────────

  - id: T-009
    axis: 3
    judgment: 가치
    title: 배당을 늘린 기업과 늘리지 못한 기업
    question: >-
      최근 3년간 배당을 꾸준히 늘린 기업과 그러지 못한 기업을 갈라놓은 것은
      이익인가, 현금흐름인가, 지배구조인가.
    why_now:
      - text: "예금 금리 3.08%, 국고 3년 3.791% — 배당수익률의 기준선이 올라갔다"
        source: ECOS 100대 지표
      - text: "제조업 부채비율 75.78%로 재무 여력은 있다 (2024)"
        source: ECOS 100대 지표
    splits:
      - 이익 체력이 결정한다
      - 지배구조·주주환원 의지가 결정한다
      - 금리 4% 시대에는 배당주 자체가 채권 대비 매력이 없다
    data:
      ready: full
      series:
        - {source: dart, dataset: dividends}
        - {source: dart, dataset: financials}
        - {source: krx, dataset: stock_kospi}
    output: 내 배당 종목의 배당 지속 가능성을 무엇으로 판단하고 있었나
    prep: 4
    origin: 지표 스캔
    status: candidate

  - id: T-010
    axis: 3
    judgment: 가치
    title: 공시를 낸 기업의 주가는 실제로 달랐나
    question: >-
      주주환원·자사주 관련 공시를 낸 기업과 내지 않은 기업의 이후 성과를
      비교하면 차이가 있나. 있다면 공시 자체 때문인가, 그런 공시를 낼 수
      있는 기업이 원래 좋았기 때문인가.
    why_now:
      - text: "고점 대비 -22% 구간에서 주주환원 공시가 방어력을 줬는지 확인할 수 있는 표본이 생겼다"
        source: KRX index_kospi
    splits:
      - 공시가 실제로 재평가를 만든다
      - 선택 편향이다 — 원래 좋은 기업이 공시도 한다
      - 단기 이벤트일 뿐 6개월 뒤엔 사라진다
    data:
      ready: full
      series:
        - {source: dart, dataset: disclosures}
        - {source: krx, dataset: stock_kospi}
    output: 나는 공시를 매수 근거로 쓸 것인가, 쓴다면 어떤 조건에서
    prep: 5
    origin: 지표 스캔
    status: candidate

  - id: T-011
    axis: 3
    judgment: 리스크
    title: 평균 부채비율 76%인데 왜 어떤 기업은 금리에 취약한가
    question: >-
      제조업 전체 부채비율은 낮다. 그런데 금리 상승 구간에서 크게 흔들린
      기업들이 있다. 총량 지표가 놓치는 것은 무엇인가.
    why_now:
      - text: "제조업 부채비율 75.78% (2024)"
        source: ECOS 100대 지표
      - text: "회사채 AA- 3년 4.496%, 국고 3년 대비 70bp (26.08.12)"
        source: ECOS 100대 지표
    splits:
      - 부채의 총량이 아니라 만기 구조가 문제다
      - 변동금리 비중이 갈랐다
      - 부채가 아니라 영업현금흐름 변동성이 진짜 원인이다
    data:
      ready: full
      series:
        - {source: dart, dataset: financials}
        - {source: krx, dataset: stock_kospi}
    output: 내 종목의 이자보상배율과 차입 만기 구조를 확인해본 적이 있는가
    prep: 4
    origin: 지표 스캔
    status: candidate

  # ── 4축 포트폴리오·리스크 점검 ─────────────────────────────────

  - id: T-012
    axis: 4
    judgment: 리스크
    title: 3.3배와 -22%를 겪은 내 포트폴리오
    question: >-
      이번 상승과 하락에서 내 계좌는 시장 대비 어땠나. 그 차이는 종목
      선택인가, 비중인가, 타이밍인가.
    why_now:
      - text: "코스피 3.3배 상승 후 -22% — 한 번의 사이클 표본이 만들어졌다"
        source: KRX index_kospi
    splits:
      - 개인별로 갈린다
    data:
      ready: external
      note: 참가자 각자의 보유 내역. 운영자는 벤치마크만 준비한다
      series:
        - {source: krx, dataset: index_kospi, field: CLSPRC_IDX}
    output: 내 성과에서 선택·비중·타이밍의 기여를 각각 한 줄로
    prep: 2
    origin: 지표 스캔
    status: candidate

  - id: T-013
