layers:
  통념:
    role: 검증할 주장을 만든다
    maps_to: pack.json 의 claim
  견해:
    role: 찬반 양쪽 논거를 채운다
    maps_to: pack.json 의 for / against
  1차:
    role: 사실을 확인한다
    maps_to: pack.json 의 facts
    note: >-
      피드가 없는 것이 맞다. 1차 숫자는 ECOS·KRX·DART 어댑터로 들어오고
      출처와 캐시 키가 함께 남는다. 보도자료 본문은 숫자를 대신하지 않는다
